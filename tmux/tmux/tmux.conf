# tmux config — VS Code Dark+ theme, see palette.md

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 10000

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# --- VS Code Dark+ colors ---
set -g status-style "bg=#1e1e1e,fg=#d4d4d4"
set -g status-left-length 20
set -g status-left "#[bg=#007acc,fg=#1e1e1e,bold] #S #[bg=#1e1e1e,fg=#007acc]"
set -g status-right "#[fg=#454545]#[bg=#252526,fg=#9cdcfe] %H:%M #[bg=#252526,fg=#569cd6] %d-%b-%y "

setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=#858585,bg=#1e1e1e"
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=#1e1e1e,bg=#007acc,bold"

set -g pane-border-style "fg=#454545"
set -g pane-active-border-style "fg=#007acc"

set -g message-style "bg=#252526,fg=#d4d4d4"
set -g message-command-style "bg=#252526,fg=#d4d4d4"

setw -g mode-style "bg=#264f78,fg=#d4d4d4"
